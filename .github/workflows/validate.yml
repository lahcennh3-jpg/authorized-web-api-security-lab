name: Validate laboratory safeguards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validation code
        run: python -m compileall -q scripts tests

      - name: Run authorization-gate regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate public template schema
        run: python scripts/authorization_gate.py scope/authorization.example.json --validate-only
